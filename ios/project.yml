name: CodexPocket
options:
  bundleIdPrefix: dev.codexpocket
  deploymentTarget:
    iOS: '17.0'
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  Crypto:
    url: https://github.com/apple/swift-crypto.git
    majorVersion: 3.12.3
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    exactVersion: 0.3.4
targets:
  CodexPocket:
    type: application
    platform: iOS
    sources:
      - path: CodexPocket
        excludes: [Info.plist]
    dependencies:
      - package: Citadel
      - package: Crypto
        product: Crypto
      - package: NIOSSH
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.codexpocket.app
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CodexPocket/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Codex Pocket
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: '1'
    scheme:
      gatherCoverageData: false
  CodexPocketTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CodexPocketTests]
    dependencies:
      - target: CodexPocket
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CodexPocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CodexPocketUITests]
    dependencies:
      - target: CodexPocket
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CodexPocket
schemes:
  CodexPocket:
    build:
      targets:
        CodexPocket: all
    test:
      targets: [CodexPocketTests, CodexPocketUITests]
